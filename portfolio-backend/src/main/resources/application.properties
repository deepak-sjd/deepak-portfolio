spring.application.name=portfolio-backend

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial portfolio database schema
# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SERVER
# ============================================================

server.port=${SERVER_PORT:8080}

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ============================================================
# FILE UPLOADS (notes resources)
# ============================================================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.file.upload-dir=./uploads
app.file.public-base-url=/files

# ============================================================
# SECURITY
# ============================================================
# Shared secret required (via the X-Admin-Api-Key header) for every
# write operation (POST/PUT/DELETE) and for admin-only reads such as
# GET /api/v1/contact and GET /api/v1/services/admin.
# No default on purpose (same convention as DB_PASSWORD above) so the
# app refuses to start until a real key is supplied.
admin.api.key=${Deepak_7479519511_9931186058}

# Comma-separated list of origins allowed to call the API.
# Defaults to local dev; set CORS_ALLOWED_ORIGINS to the real deployed
# frontend domain(s) in production, e.g. https://deepakkumar.dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ============================================================
# ERROR HANDLING (defense in depth alongside GlobalExceptionHandler)
# ============================================================
# Never let Spring Boot's default error machinery leak exception
# details/stack traces for requests that bypass our own handler
# (e.g. a 404 for a path no controller matches).
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
